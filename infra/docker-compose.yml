services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: attention
      POSTGRES_USER: attention
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attention_local}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attention -d attention"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: attention
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-attention_local}
      # On a fresh volume the image intermittently fails reading the generated
      # .erlang.cookie (eacces). Passing the cookie to server and CLI avoids the file.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -setcookie ${RABBITMQ_COOKIE:-attention_local_cookie}
      RABBITMQ_CTL_ERL_ARGS: -setcookie ${RABBITMQ_COOKIE:-attention_local_cookie}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
  rabbitdata:
